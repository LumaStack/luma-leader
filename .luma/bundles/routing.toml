# Generated by `luma-foreman apply`. Edits are lost.
#
# Every Document that says when it applies, and what happens when it is
# not complied with. The permission gate reads the rows that block; it
# cannot be told to ignore them, and nothing in `agent-permissions`
# writes here.

[[rule]]
bundle = "lumastack/luma-catalog/audit-records"
document = "policy/audit-layout"
title = "How audits are stored"
path = ".luma/bundles/lumastack/luma-catalog/audit-records/policy/audit-layout.md"
on_violation = "allow"
matches = ["eager"]

[[rule]]
bundle = "lumastack/luma-catalog/audit-records"
document = "policy/writing-findings"
title = "Writing a finding"
path = ".luma/bundles/lumastack/luma-catalog/audit-records/policy/writing-findings.md"
on_violation = "allow"
matches = ["topic:writing a finding in an audit"]

