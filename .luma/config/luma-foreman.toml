# How luma-foreman behaves in this project. Committed, and shared by everyone.
#
# Kept minimal by design. What you leave out follows the tool and improves with
# it; what you set here is frozen, and every frozen value is one more thing to
# reconcile at upgrade.

[catalog]
# Where `luma-foreman get` takes bundles from when no --from is given.
source = "https://github.com/LumaStack/luma-catalog"

# Words this project retired. `luma-foreman inspect` reports each use as a
# notice — never a finding, because a grep cannot tell a revival from an
# ordinary use of the same word, and the reader has to decide.
#
# These two were retired in `luma-foreman`, by ADR-0003 and ADR-0005 there.
# This repository does not own that decision; it documents the tool, so its
# prose is downstream of it. Renaming a command was already a two-repository
# change — this is the third.
#
# An entry is removed when the thing the word named no longer exists, not after
# a number of releases. `refit` reached that state on 2026-08-26 and is absent
# here for the same reason it is absent there: the command was removed rather
# than renamed, so nothing is left to reach for a word about. `outfit` and
# `projection` both still name things in the product, under other names.
#
# Vendored bundles under `.luma/bundles/` are skipped by the rule itself —
# somebody else's prose, fixed upstream and re-adopted, never in place.

[[retired]]
term = "projection"
use = "what `apply` writes — the adapters — or `apply` itself"
decided = ["ADR-0003", "ADR-0005"]
except = [
  ".luma/records/",             # audits are append-only; they say what was true when filed
  "docs/loading-mechanisms.md", # its naming section IS the record of this retirement
  "docs/DECISIONS.md",          # the four-verbs argument cannot be made without the old verbs
]

[[retired]]
term = "outfit"
use = "`apply`"
decided = ["ADR-0003", "ADR-0004", "ADR-0005"]
except = [
  ".luma/records/",             # as above
  "docs/loading-mechanisms.md", # as above
  "docs/DECISIONS.md",          # as above
]

# The format's released names, from `luma-knowledge-format/SPEC.md` section 13.
#
# These are not this repository's decision and not foreman's — the format
# retired them, and section 13 is the list a tool can read. It says so itself:
# a released name in a published Document's prose is valid, so a consumer MAY
# report it and MUST NOT reject for it. That is a notice, which is what this is.
#
# Hand-copied, which is the weakness. The durable version reads section 13
# directly instead of each repository transcribing it; until that exists, this
# goes stale the next time the format releases a name and nobody notices.

[[retired]]
term = "preload"
use = "`matches` — and `matches: always` for the one route to being loaded up front"
decided = ["SPEC.md section 13", "released in v0.0.12"]
except = [
  ".luma/records/",                                     # append-only
  "docs/loading-mechanisms.md",                         # the document that argued preload out
  "docs/DECISIONS.md",                                  # settled entries record what was true
  ".luma/backlog/ideas/conditional-preload.md",         # the idea is about the field itself
  ".luma/backlog/ideas/changing-many-moving-parts-at-once.md",  # its worked example is this migration
]


[[retired]]
term = "applies_to"
use = "`matches` (section 10.7)"
decided = ["SPEC.md section 13", "released in v0.0.15"]
except = [
  ".luma/records/",
  "docs/loading-mechanisms.md",
  "docs/DECISIONS.md",
  ".luma/backlog/ideas/changing-many-moving-parts-at-once.md",  # its worked example is this exact migration
]

# `compliance` and `obligation` were tried here and removed. Both are ordinary
# English in this repository — "a compliance team", "the obligation ladder" —
# and `obligation` also names a live concept of its own: how strongly a catalog
# expects a project to adopt a bundle, which is not the Type Definition field
# that was renamed. Retiring either trains a reader to skim past notices, which
# costs more than the two stale field references they would have caught.

